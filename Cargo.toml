[package]
name = "tar-vault-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
yaml-edit = "0.3"
rpassword = "7"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
fs2 = "0.4"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
zeroize = "1"
csv-core = "0.1"
